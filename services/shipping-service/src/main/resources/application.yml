server:
  port: 8083

app:
  service-name: shipping

spring:
  application:
    name: shipping-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/shipping_db
    username: ${DB_USER:alert}
    password: ${DB_PASSWORD:alert}
    hikari:
      maximum-pool-size: 20
  sql:
    init:
      mode: always

fault-injection:
  enabled: ${FAULT_INJECTION_ENABLED:false}

alert:
  notification-url: ${NOTIFICATION_URL:http://localhost:8084}
  callback-base-url: ${ALERT_CALLBACK_BASE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
