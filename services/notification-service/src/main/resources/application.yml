server:
  port: 8084

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USER:alert}
    password: ${DB_PASSWORD:alert}
    hikari:
      maximum-pool-size: 20
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

alert:
  slack-webhook-url: ${SLACK_WEBHOOK_URL:http://localhost:8070/webhook}
  email:
    from: alerts@alert-system.local
    to: oncall@alert-system.local
  dispatch:
    poll-ms: 200
    batch-size: 50
    stale-seconds: 60
  retry-batch:
    # 원안 배치 주기는 5분 — 실험 시간 안에 관찰하려고 기본 30초, 환경변수로 조정
    interval-ms: ${RETRY_BATCH_INTERVAL_MS:30000}
    threshold: ${RETRY_BATCH_THRESHOLD:10}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
