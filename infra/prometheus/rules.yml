# SY-01 규칙 서브셋 (docs/03-methodologies/system/sy-01-level-triggered-metrics.md) — SG-01+ 변형용
groups:
  - name: sy01-subset
    rules:
      - alert: ServiceDown
        expr: up{job=~"order|product|shipping|notification"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} scrape failed for 30s"
      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
            / sum by (job) (rate(http_server_requests_seconds_count[1m])) > 0.05
        for: 1m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.job }} 5xx ratio {{ $value | humanizePercentage }}"
